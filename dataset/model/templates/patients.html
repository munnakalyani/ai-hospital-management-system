<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patients - AI Hospital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7fb;
        }

        /* Header */

        .header {
            background-color: #0d6efd;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background-color: white;
            color: #0d6efd;

            padding: 10px 18px;

            text-decoration: none;

            border-radius: 5px;

            font-weight: bold;
        }

        /* Container */

        .container {
            max-width: 1100px;

            margin: 30px auto;

            padding: 20px;
        }

        /* Title */

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #333;

            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        /* Form */

        .form-box {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);

            margin-bottom: 30px;
        }

        .form-box h3 {
            margin-bottom: 20px;

            color: #333;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        .form-group input,
        .form-group select {

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        .button {

            margin-top: 20px;

            background-color: #0d6efd;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;
        }

        .button:hover {
            background-color: #0b5ed7;
        }

        /* Patient Table */

        .table-box {

            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);
        }

        .table-box h3 {

            margin-bottom: 20px;

            color: #333;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th {

            background-color: #0d6efd;

            color: white;

            padding: 12px;

            text-align: left;
        }

        td {

            padding: 12px;

            border-bottom: 1px solid #ddd;
        }

        tr:hover {

            background-color: #f5f5f5;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;
            }

            .header {

                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            table {

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <div class="header">

        <h1>
            🏥 AI Hospital Management System
        </h1>

        <a href="/dashboard"
           class="back">

            ← Dashboard

        </a>

    </div>


    <!-- Main Container -->

    <div class="container">


        <!-- Page Title -->

        <div class="title">

            <h2>
                Patient Management
            </h2>

            <p>
                Register and manage hospital patients.
            </p>

        </div>


        <!-- Patient Form -->

        <div class="form-box">

            <h3>
                ➕ Add New Patient
            </h3>


            <form method="POST"
                  action="/patients">


                <div class="form-grid">


                    <!-- Name -->

                    <div class="form-group">

                        <label>
                            Patient Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter patient name"
                            required>

                    </div>


                    <!-- Age -->

                    <div class="form-group">

                        <label>
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            placeholder="Enter age"
                            min="0"
                            max="120"
                            required>

                    </div>


                    <!-- Gender -->

                    <div class="form-group">

                        <label>
                            Gender
                        </label>

                        <select
                            name="gender"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter email address">

                    </div>


                    <!-- Address -->

                    <div class="form-group">

                        <label>
                            Address
                        </label>

                        <input
                            type="text"
                            name="address"
                            placeholder="Enter address">

                    </div>


                </div>


                <button
                    type="submit"
                    class="button">

                    Add Patient

                </button>


            </form>

        </div>


        <!-- Patient List -->

        <div class="table-box">

            <h3>
                📋 Patient List
            </h3>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Phone</th>

                        <th>Email</th>

                    </tr>

                </thead>


                <tbody>


                    <!-- Sample Patient -->

                    <tr>

                        <td>1</td>

                        <td>John Smith</td>

                        <td>35</td>

                        <td>Male</td>

                        <td>555-0101</td>

                        <td>john@example.com</td>

                    </tr>


                    <tr>

                        <td>2</td>

                        <td>Sarah Johnson</td>

                        <td>28</td>

                        <td>Female</td>

                        <td>555-0102</td>

                        <td>sarah@example.com</td>

                    </tr>


                </tbody>

            </table>


        </div>


    </div>


</body>

</html>
